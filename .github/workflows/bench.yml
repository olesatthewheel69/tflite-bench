name: tflite-bench
on: [workflow_dispatch]

env:
  LITERT_VERSION: "2.2.0"

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: lscpu
      - name: встановити залежності
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q numpy py-cpuinfo
          python -m pip install -q "ai-edge-litert==${LITERT_VERSION}"
      - name: замір
        run: python bench.py
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.runner }}
          path: result-*.csv
